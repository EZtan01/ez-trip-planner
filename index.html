*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#faf5f0;--s1:rgba(255,255,255,.58);--s2:rgba(255,248,243,.55);--s3:rgba(228,213,202,.28);
--acc:#c87b62;--acc2:#b56a52;--accL:rgba(200,123,98,.10);
--grn:#6aab90;--grnL:rgba(106,171,144,.10);--org:#c89b6a;--orgL:rgba(200,155,106,.10);
--red:#be6e6e;--redL:rgba(190,110,110,.10);--blu:#6a96b5;--bluL:rgba(106,150,181,.10);
--txt:#3d3530;--t2:#8c7e74;--t3:#b5a99e;--bdr:rgba(195,178,165,.30);
--r:16px;--sh:0 3px 18px rgba(160,135,115,.10);--sh2:0 1px 6px rgba(160,135,115,.06);
}
html{font-size:18px}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.55}
button{cursor:pointer;border:none;font-family:inherit;transition:.15s}
input,textarea,select{font-family:inherit;background:rgba(255,255,255,.65);color:var(--txt);border:1px solid var(--bdr);border-radius:10px;padding:7px 12px;outline:none;font-size:.85rem;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accL)}
textarea{resize:vertical}a{color:var(--acc2)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(250,245,240,.85);backdrop-filter:blur(18px);border-bottom:1px solid var(--bdr);padding:0 20px;display:flex;align-items:center;gap:4px;height:54px;overflow-x:auto}
.nav-logo{font-size:1.1rem;font-weight:800;color:var(--acc2);margin-right:14px;white-space:nowrap}
.nt{padding:7px 16px;border-radius:22px;background:transparent;color:var(--t2);font-size:.82rem;font-weight:500;white-space:nowrap}
.nt:hover{background:var(--accL);color:var(--txt)}.nt.on{background:var(--acc);color:#fff}

/* LAYOUT */
.pg{display:none;padding:20px 24px;max-width:1460px;margin:0 auto}.pg.on{display:block}
.c{background:var(--s1);backdrop-filter:blur(10px);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.ct{font-size:.9rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
h2{font-size:1.25rem;font-weight:800;margin-bottom:18px;color:var(--acc2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:960px){.g2,.g3,.g4{grid-template-columns:1fr}}
.fb{display:flex;justify-content:space-between;align-items:center}
.sb{max-height:260px;overflow-y:auto;padding-right:4px}
.ss{max-height:190px;overflow-y:auto;padding-right:4px}

/* STAT */
.st{text-align:center;padding:16px 10px}
.sv{font-size:1.55rem;font-weight:800;margin:3px 0}
.sl{font-size:.72rem;color:var(--t2);letter-spacing:.3px;text-transform:uppercase}

/* PROGRESS */
.pb{height:8px;background:var(--s3);border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .5s}
.pl{display:flex;justify-content:space-between;font-size:.7rem;color:var(--t2);margin-top:3px}

/* BTN */
.btn{padding:6px 18px;border-radius:22px;font-size:.78rem;font-weight:500}
.bp{background:var(--acc);color:#fff}.bp:hover{background:var(--acc2)}
.bs{background:var(--s3);color:var(--txt)}.bs:hover{background:var(--bdr)}
.bd{background:var(--red);color:#fff;font-size:.72rem;padding:4px 10px}
.bsm{padding:4px 12px;font-size:.72rem}
.bg{background:transparent;color:var(--acc2);padding:3px 8px;font-size:.72rem;border-radius:8px}.bg:hover{background:var(--accL)}

/* TAG */
.tg{display:inline-block;padding:2px 9px;border-radius:12px;font-size:.68rem;font-weight:600;letter-spacing:.2px}
.tok{background:var(--grnL);color:var(--grn)}.tpl{background:var(--orgL);color:var(--org)}.twr{background:var(--redL);color:var(--red)}
.tsc{background:var(--bluL);color:var(--blu)}

/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(61,53,48,.32);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center}
.mbg.show{display:flex}
.md{background:var(--bg);border:1px solid var(--bdr);border-radius:20px;padding:24px;width:94%;max-width:560px;max-height:82vh;overflow-y:auto;box-shadow:0 10px 50px rgba(0,0,0,.12)}
.md h3{font-size:1.05rem;margin-bottom:14px;color:var(--acc2)}
.fr{margin-bottom:10px}.fr label{display:block;font-size:.72rem;color:var(--t2);margin-bottom:3px;font-weight:600}
.fr input,.fr textarea,.fr select{width:100%}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ma{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}

/* REGION */
.rg{margin-bottom:16px;border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh2)}
.rh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--s2);cursor:pointer;user-select:none}
.rh:hover{background:var(--s3)}
.ra{transition:transform .2s;font-size:.65rem;color:var(--t2)}.ra.open{transform:rotate(90deg)}
.rt{font-weight:700;font-size:1rem;color:var(--acc2);flex:1}
.rs{display:flex;gap:14px;font-size:.78rem;color:var(--t2)}
.rb{border-top:1px solid var(--bdr)}

/* ITIN */
.it{padding:14px 18px;border-bottom:1px solid rgba(195,178,165,.18);cursor:pointer;transition:background .1s}
.it:hover{background:var(--accL)}.it:last-child{border:none}
.it.dragging{opacity:.35}.it.dragover{background:var(--accL);border-top:2px solid var(--acc)}
.ir{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inum{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.ix{padding:14px 18px 10px;border-bottom:1px solid rgba(195,178,165,.18);background:rgba(255,255,255,.25)}

/* PLACE */
.pi{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid rgba(195,178,165,.12);font-size:.82rem}
.pi:last-child{border:none}

/* CHECKLIST */
.ck{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(195,178,165,.12);font-size:.85rem}
.ck label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer}
.ck input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc)}
.ckt{padding:2px 8px;border-radius:8px;font-size:.65rem;font-weight:600;background:var(--accL);color:var(--acc2)}

/* TODO */
.todo{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--s2);border:1px solid var(--bdr);border-radius:10px;margin-bottom:6px;font-size:.85rem}
.todo input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc)}
.todo.done{opacity:.45}

/* BUDGET TABLE */
.bt{width:100%;border-collapse:collapse;font-size:.78rem}
.bt th{text-align:left;padding:6px 8px;border-bottom:2px solid var(--bdr);color:var(--t2);font-size:.7rem;font-weight:600;white-space:nowrap}
.bt td{padding:5px 8px;border-bottom:1px solid rgba(195,178,165,.12)}
.bt tr:hover{background:var(--accL)}
.bt input{padding:4px 6px;width:68px;text-align:right;font-size:.78rem}
.bt .ov{color:var(--red);font-weight:700}

.nc{padding:14px;border-left:3px solid var(--acc);margin-bottom:10px}
.rem{background:var(--orgL);border:1px solid rgba(200,155,106,.2);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:.78rem;color:var(--org)}
.calcr{padding:12px;border-radius:10px;font-size:.85rem;margin-top:10px}
.calcok{background:var(--grnL);border:1px solid rgba(106,171,144,.2);color:#4a8a6e}
.calcbad{background:var(--redL);border:1px solid rgba(190,110,110,.2);color:var(--red)}

/* CALENDAR */
/* DASHBOARD DRAG */
.dw{transition:opacity .15s,border .15s;border-top:2px solid transparent}
.dw .ct{user-select:none}
#dboard{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#dboard .dw.g4,#dboard .dw[data-wid="stats"]{grid-column:1/-1}
#dboard .dw>.c{margin-bottom:0}
@media(max-width:960px){#dboard{grid-template-columns:1fr}}

.cal-day{min-height:58px;border-radius:8px;padding:4px 5px;font-size:.7rem;border:1px solid transparent;cursor:default;transition:.1s}
.cal-day.has{cursor:pointer;border-color:var(--bdr)}.cal-day.has:hover{box-shadow:0 0 0 2px var(--acc)}

.ss{font-size:.72rem;color:var(--t2);padding:5px 10px;border-radius:8px;background:var(--s3);align-self:center;cursor:pointer;border:1px solid transparent;transition:all .2s;white-space:nowrap}
.ss:hover{border-color:var(--acc)}
.ss[data-status=synced]{color:var(--grn);background:var(--grnL)}
.ss[data-status=syncing]{color:var(--acc);background:var(--accL)}
.ss[data-status=pending]{color:var(--org);background:var(--orgL)}
.ss[data-status=error]{color:#c66;background:rgba(200,102,102,.1)}
.ss[data-status=offline]{color:var(--t2)}
.ss[data-status=idle]{color:var(--t2)}
</style>

if(!D.td)D.td=JSON.parse(JSON.stringify(TD0));if(!D.pc)D.pc=JSON.parse(JSON.stringify(PC0));if(!D.ro)D.ro={};if(!D.dwo)D.dwo=[...DWID];if(!D.gl)D.gl=JSON.parse(JSON.stringify(GL0));if(!D.glm)D.glm={}}
function sv(){D.__ts=Date.now();localStorage.setItem(SK,JSON.stringify(D));if(typeof scheduleAutoSync==='function')scheduleAutoSync()}
function fm(n){return n!=null&&!isNaN(n)?'RM '+Math.round(n).toLocaleString():'—'}
function fD(d){return d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—'}
function pc(a,b){return b?Math.round(a/b*100):0}
function tI(t){return t==='flight'?'✈️':t==='bus'?'🚌':'🚂'}
function cc(s){return(s.tc||0)+s.days*((s.food||0)+(s.stay||0)+(s.lt||0)+(s.tick||0))+(s.oth||0)}
function tDays(){return D.stops.reduce((a,x)=>a+(x.standby?0:x.days),0)}
function tTrip(){return D.stops.reduce((a,x)=>a+(x.standby?0:cc(x)),0)}
function tPre(){return D.pc.reduce((a,x)=>a+x.v,0)}
function fxM(){return D.fx.reduce((a,x)=>a+x.v,0)}
function mo(){return Math.ceil(tDays()/30)||1}
function tAll(){return tTrip()+tPre()+fxM()*mo()}
function schD(){let d=0;D.stops.forEach(s=>{if(s.sch&&!s.standby)d+=s.days});return d}
function recalc(){if(!D.stops.length)return;let d=new Date('2027-01-14');D.stops.forEach(s=>{if(s.standby){s.date='';return}s.date=d.toISOString().split('T')[0];d.setDate(d.getDate()+s.days)})}
function regOf(c){for(const r of REG)if(r.c.includes(c))return r.n;return'🌍 其他'}
function getGroups(){const g=[];let lr=null;D.stops.forEach((s,i)=>{const r=regOf(s.co);if(r!==lr){g.push({r,stops:[]});lr=r}g[g.length-1].stops.push({...s,_i:i})});return g}
function savingsNeeded(){return tAll()-D.mi*mo()}
function savPct(){const need=savingsNeeded();return need<=0?100:pc(D.sav,need)}

document.querySelectorAll('.nt').forEach(t=>t.addEventListener('click',function(){
document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
document.querySelectorAll('.nt').forEach(t=>t.classList.remove('on'));
this.classList.add('on');document.getElementById('pg-'+this.dataset.p).classList.add('on');
R[this.dataset.p]()}));
function openM(h){document.getElementById('mc').innerHTML=h;document.getElementById('modal').classList.add('show')}
function closeM(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeM()});

const R={};let expId=null;

// Dashboard widget order
const DWID=['stats','savings','budget','rank','todo'];

W.savings=`<div class="dw" data-wid="savings" draggable="true"><div class="c">

groups.forEach(g=>{
const open=D.ro[g.r]!==false;
const rc=g.stops.reduce((a,x)=>a+(x.standby?0:cc(x)),0),rd=g.stops.reduce((a,x)=>a+(x.standby?0:x.days),0),rconf=g.stops.filter(x=>x.st==='confirmed'&&!x.standby).length;
h+=`<div class="rg"><div class="rh" onclick="D.ro['${g.r}']=!${open};sv();R.itinerary()">

g.stops.forEach(s=>{

h+=`<div class="it" draggable="true" data-i="${s._i}" style="border-left:4px solid ${isSb?'var(--t3)':coCol};${isSb?'opacity:.5;':''}${isSb?'background:var(--s3);':''}" ondragstart="ds(event,${s._i})" ondragover="dv(event)" ondrop="dp(event,${s._i})" ondragend="de(event)" onclick="tgl(${s.id})">
<div class="ir">
<div class="inum" style="background:${isSb?'var(--t3)':coCol}">${isSb?'⏸':s._i+1}</div>

${isSb?'<span class="tg" style="background:var(--t3);color:#fff;font-size:.65rem">待定</span>':''}
<span style="background:${isSb?'var(--s3)':'var(--accL)'};padding:2px 10px;border-radius:10px;font-size:.75rem;font-weight:600;${isSb?'text-decoration:line-through;color:var(--t3)':''}">${s.days}天</span>
<span style="font-size:.82rem">${gT(s)}</span>
${isSb?'':'<span class="tg '+( s.st==='confirmed'?'tok':'tpl')+'">'+(s.st==='confirmed'?'已确认':'计划中')+'</span>'}
${over&&!isSb?'<span class="tg twr">超预算</span>':''}
<span style="margin-left:auto;font-size:.78rem;color:var(--t2)">${isSb?'待定':fD(s.date)}</span>
</div>
<div style="display:flex;gap:14px;margin-top:6px;font-size:.78rem;color:var(--t2)">
<span>🚗${fm(s.tc)} <span class="tg ${s.ts==='confirmed'?'tok':'tpl'}" style="font-size:.6rem">${s.ts}</span></span>
<span>🍽${fm(s.food)}/天</span><span>🏠${fm(s.stay)}/晚</span>
<span style="margin-left:auto;font-weight:700;color:${over?'var(--red)':'var(--acc2)'}">总${fm(cost)}/${fm(s.bg)}</span>

:`<button class="btn bs bsm" style="margin-bottom:8px" onclick="aPl(${s.id})">+ 景点</button>`}

// ============ CALENDAR ============
R.calendar=function(){
const el=document.getElementById('pg-calendar');
if(!D.stops.length){el.innerHTML='<h2>📅</h2>';return}
const dm={};D.stops.forEach(s=>{if(s.standby||!s.date)return;const d=new Date(s.date);for(let i=0;i<s.days;i++){dm[d.toISOString().split('T')[0]]=s;d.setDate(d.getDate()+1)}});
const endS=D.stops[D.stops.length-1],end=new Date(endS.date);end.setDate(end.getDate()+endS.days);
let h=`<h2>📅 日历视图 <span style="font-size:.78rem;color:var(--t2);font-weight:400">点击编辑行程</span></h2>`;
let cur=new Date(2027,0,1);
while(cur<=end){
const y=cur.getFullYear(),m=cur.getMonth();
h+=`<div style="margin-bottom:18px"><div style="font-size:1rem;font-weight:700;color:var(--acc2);margin-bottom:8px;padding-bottom:5px;border-bottom:2px solid var(--acc)">${cur.toLocaleDateString('en',{month:'long',year:'numeric'})}</div>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;
['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>h+=`<div style="font-size:.65rem;color:var(--t2);text-align:center;padding:3px;font-weight:600">${d}</div>`);
let dow=(new Date(y,m,1).getDay()+6)%7;
for(let i=0;i<dow;i++)h+=`<div></div>`;
const dim=new Date(y,m+1,0).getDate();
for(let d=1;d<=dim;d++){
const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const s=dm[key];
const col=s?(CCOUNTRY[s.co]||'var(--acc)'):'transparent';
h+=`<div class="cal-day ${s?'has':''}" style="background:${s?col+'18':'transparent'};border-color:${s?col+'40':'transparent'}" ${s?`onclick="calEdit(${s.id})"`:''}>
<div style="font-weight:600;font-size:.7rem;color:var(--t2)">${d}</div>
${s?`<div style="font-weight:700;color:${col};font-size:.65rem;line-height:1.1">${s.ci}</div><div style="font-size:.6rem;color:var(--t2)">${gT(s)}</div>`:''}
${FEST[key]&&FEST[key].co===getCoOnDate(key)?`<div style="font-size:.55rem;color:var(--org);font-weight:700;line-height:1" title="${FEST[key].e}">🎪${FEST[key].n.substring(0,8)}</div>`:''}</div>`;
}h+=`</div></div>`;cur=new Date(y,m+1,1)}
el.innerHTML=h;
};
window.calEdit=id=>{const s=D.stops.find(x=>x.id===id);const idx=D.stops.indexOf(s);
openM(`<h3>编辑 ${s.co}·${s.ci}</h3>${sForm(s,'ce')}
<div class="ma"><button class="btn bs" onclick="closeM()">取消</button>
<button class="btn bp" onclick="const f=rForm('ce');Object.assign(D.stops[${idx}],f);recalc();sv();closeM();R.calendar()">保存</button></div>`);

const catS=catV.reduce((a,b)=>a+b,0);

const planT=D.stops.filter(s=>s.ts!=='confirmed'&&!s.standby).reduce((a,x)=>a+(x.tc||0),0);

let h=`<h2>💰 Budget 管理</h2>

${(()=>{const gap=all-avail;

:`<div class="calcr calcok">✅ 资金充足！余 <strong>${fm(-gap)}</strong>。</div>`})()}
<div style="font-size:.78rem;color:var(--t2);margin-top:6px">交通已确认 <strong style="color:var(--grn)">${fm(confT)}</strong> · 计划中 <strong style="color:var(--org)">${fm(planT)}</strong></div>
</div>

<div class="c"><div class="ct">📋 行前费用 <span style="font-size:.72rem;color:var(--t2);font-weight:400">(auto sync到总花费)</span></div>
<div class="ss">${D.pc.map((p,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bdr)">
<span style="flex:1">${p.n}</span>
<span class="tg ${p.ok?'tok':'tpl'}" style="cursor:pointer" onclick="D.pc[${i}].ok=!D.pc[${i}].ok;sv();R.budget()">${p.ok?'✓已付':'未付'}</span>
<input type="number" value="${p.v}" style="width:90px;text-align:right" onchange="D.pc[${i}].v=+this.value;sv();R.budget()">
</div>`).join('')}
<button class="btn bs bsm" style="margin-top:6px" onclick="D.pc.push({n:'新项目',v:0,ok:false});sv();R.budget()">+ 添加</button>
</div>
<div style="display:flex;justify-content:space-between;padding:8px 0;font-weight:700;border-top:2px solid var(--bdr);margin-top:6px"><span>行前总计</span><span>${fm(pre)}</span></div>
</div>

<div class="g3">
<div class="c st"><div class="sl">预计旅行花费</div><div class="sv" style="color:var(--acc)">${fm(trip)}</div><div class="sl">≈${fm(Math.round(trip/tDays()))}/天</div></div>
<div class="c st"><div class="sl">行前+固定(${m}月)</div><div class="sv" style="color:var(--org)">${fm(pre+fxT)}</div></div>
<div class="c st"><div class="sl">预估总花费</div><div class="sv" style="color:${all>D.bgt?'var(--red)':'var(--grn)'}">${fm(all)}</div><div class="sl">${all>D.bgt?'⚠️超出'+fm(all-D.bgt):'✅预算内'}</div></div>

<span style="width:75px;font-size:.82rem;flex-shrink:0">${x.l}</span>

<div style="flex:1;max-width:100px;height:5px;background:var(--s3);border-radius:3px"><div style="width:${pc(v,trip)}%;height:100%;background:${CCOUNTRY[c]||CC[i]};border-radius:3px"></div></div>

  const daily=s.days?(cc(s)/s.days):0;
  const total=cc(s);
  h+=`<tr><td>${i+1}</td><td>${s.co}</td><td>${s.ci}</td><td>${s.days}</td><td>${cur}</td><td>${fm(Math.round(daily))}</td><td>${(daily*r).toFixed(0)} ${cur}</td><td>${fm(total)}</td><td>${(total*r).toFixed(0)} ${cur}</td></tr>`;
});
h+=`</tbody></table></div></div>`;

h+=`<div class="rem">⚠️ 汇率仅供参考，实际汇率以Wise/银行为准。建议出发前更新。</div>`;

el.innerHTML=h;

setTimeout(cxCalc,10);
};
window.cxCalc=(side)=>{
const rates={'MYR':1,'NPR':28.5,'INR':19.5,'KZT':103,'KGS':19.1,'GEL':0.58,'AMD':85,'BGN':0.39,'RON':1.02,'RSD':23.5,'EUR':0.21,'BAM':0.39,'TRY':8.3,'USD':0.23,'GBP':0.17};
const fromC=document.getElementById('cx-from')?.value||'MYR';
const toC=document.getElementById('cx-to')?.value||'EUR';
const lEl=document.getElementById('cx-left');
const rEl=document.getElementById('cx-right');
const rateEl=document.getElementById('cx-rate');
if(!lEl||!rEl)return;
const fR=rates[fromC]||1,tR=rates[toC]||1;
const xRate=tR/fR;
if(side==='R'){const rv=+(rEl.value||0);lEl.value=xRate?+(rv/xRate).toFixed(4):0}
else{const lv=+(lEl.value||0);rEl.value=+(lv*xRate).toFixed(4)}
if(rateEl)rateEl.innerHTML='1 '+fromC+' = '+(xRate).toFixed(4)+' '+toC+'<br>1 '+toC+' = '+(1/xRate).toFixed(4)+' '+fromC;
};

// ============ EXPORT / IMPORT ============
window.exportData=()=>{
  sv();
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='ez-trip-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(a.href);
};
window.importData=()=>{
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=ev=>{
      try{
        const nd=JSON.parse(ev.target.result);
        if(!nd.stops||!Array.isArray(nd.stops)){alert('❌ 文件格式不对');return}
        if(!confirm('⚠️ 确定要导入吗？当前数据会被覆盖。'))return;
        D=nd;sv();R.dashboard();alert('✅ 导入成功！');
      }catch(err){alert('❌ JSON解析失败: '+err.message)}
    };rd.readAsText(f);
  };inp.click();
};

// ============ GIST SYNC ============
const SYNC_TOKEN_KEY='ez_trip_gh_token';
const SYNC_GIST_KEY='ez_trip_gist_id';
function getToken(){return localStorage.getItem(SYNC_TOKEN_KEY)||''}
function getGistId(){return localStorage.getItem(SYNC_GIST_KEY)||''}
function setToken(t){localStorage.setItem(SYNC_TOKEN_KEY,t)}
function setGistId(id){localStorage.setItem(SYNC_GIST_KEY,id)}

window.syncSetup=()=>{
  const curT=getToken();const curG=getGistId();
  openM(`<h3>☁️ 云端同步设置</h3>
  <div class="fr"><label>GitHub Token <span style="font-weight:400;color:var(--t2)">(只需gist权限)</span></label>
  <input id="sync-token" type="password" value="${curT}" placeholder="ghp_xxxxxxxxx"></div>
  <div class="fr"><label>Gist ID <span style="font-weight:400;color:var(--t2)">(留空=自动创建新的)</span></label>
  <input id="sync-gist" value="${curG}" placeholder="自动生成"></div>
  <div style="font-size:.75rem;color:var(--t2);margin:8px 0;line-height:1.5">
  Token只存在你这台设备的浏览器里，不会上传。<br>每台新设备只需设置一次。</div>
  <div class="ma">
  <button class="btn bs" onclick="closeM()">取消</button>
  <button class="btn bp" onclick="saveSync()">保存</button></div>`);
};
window.saveSync=()=>{
  const t=document.getElementById('sync-token').value.trim();
  const g=document.getElementById('sync-gist').value.trim();
  if(!t){alert('请输入Token');return}
  setToken(t);if(g)setGistId(g);
  closeM();alert('✅ 已保存！现在可以点 ☁️上传 或 ☁️下载 同步数据');
};

window.syncUp=async()=>{
  const token=getToken();if(!token){syncSetup();return}
  sv();
  const body={description:'EZ Trip Planner Sync',public:false,files:{'ez-trip-data.json':{content:JSON.stringify(D,null,2)}}};
  const gistId=getGistId();
  try{
    const url=gistId?'https://api.github.com/gists/'+gistId:'https://api.github.com/gists';
    const method=gistId?'PATCH':'POST';
    const res=await fetch(url,{method,headers:{'Authorization':'token '+token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify(body)});
    if(!res.ok){const e=await res.text();alert('❌ 上传失败: '+res.status+' '+e.slice(0,200));return}
    const data=await res.json();
    if(!gistId&&data.id){setGistId(data.id)}
    alert('✅ 已同步到云端！'+(gistId?'':'\\nGist ID: '+data.id+'\\n其他设备设置时填入这个ID'));
  }catch(err){alert('❌ 网络错误: '+err.message)}
};

window.syncDown=async()=>{
  const token=getToken();const gistId=getGistId();
  if(!token||!gistId){syncSetup();return}
  try{
    const res=await fetch('https://api.github.com/gists/'+gistId,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}});
    if(!res.ok){alert('❌ 下载失败: '+res.status);return}
    const data=await res.json();
    const content=data.files?.['ez-trip-data.json']?.content;
    if(!content){alert('❌ Gist里没有数据');return}
    const nd=JSON.parse(content);
    if(!nd.stops||!Array.isArray(nd.stops)){alert('❌ 数据格式不对');return}
    if(!confirm('⚠️ 确定要用云端数据覆盖本地？')){return}
    D=nd;sv();
    const curPage=document.querySelector('.nt.on')?.dataset?.p||'dashboard';
    R[curPage]();
    alert('✅ 已从云端同步到本地！');
  }catch(err){alert('❌ 错误: '+err.message)}
};


// ============ AUTO SYNC ============
let _syncTimer=null,_lastUp=0,_lastDown=0,_polling=null;
const _SYNC_DEBOUNCE=4000,_SYNC_POLL=45000;

function setSS(s){
  const el=document.getElementById('sync-status');
  if(!el)return;
  const m={synced:'✓ 已同步',syncing:'⏳ 同步中…',pending:'✏️ 待同步',offline:'⚠️ 离线',error:'✗ 同步失败',idle:'☁️ 未连接'};
  el.textContent=m[s]||'';
  el.dataset.status=s;
}

function tToast(msg,dur=2800){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(60,40,30,.92);color:#fff;padding:10px 18px;border-radius:8px;z-index:99999;font-size:.85rem;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90vw';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},dur);
}

async function _silentUp(){
  const token=getToken(),gistId=getGistId();
  if(!token)return null;
  const body={description:'EZ Trip Planner Sync',public:false,files:{'ez-trip-data.json':{content:JSON.stringify(D,null,2)}}};
  try{
    const url=gistId?'https://api.github.com/gists/'+gistId:'https://api.github.com/gists';
    const method=gistId?'PATCH':'POST';
    const res=await fetch(url,{method,headers:{'Authorization':'token '+token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify(body)});
    if(!res.ok)return null;
    const data=await res.json();
    if(!gistId&&data.id)setGistId(data.id);
    return data;
  }catch(e){return null}
}

async function _silentDown(){
  const token=getToken(),gistId=getGistId();
  if(!token||!gistId)return null;
  try{
    const res=await fetch('https://api.github.com/gists/'+gistId,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'},cache:'no-store'});
    if(!res.ok)return null;
    const data=await res.json();
    const content=data.files&&data.files['ez-trip-data.json']&&data.files['ez-trip-data.json'].content;
    if(!content)return null;
    const nd=JSON.parse(content);
    if(!nd.stops||!Array.isArray(nd.stops))return null;
    return nd;
  }catch(e){return null}
}

function scheduleAutoSync(){
  if(!getToken())return;
  if(_syncTimer)clearTimeout(_syncTimer);
  setSS('pending');
  _syncTimer=setTimeout(autoUp,_SYNC_DEBOUNCE);
}

async function autoUp(){
  if(!navigator.onLine){setSS('offline');return}
  if(!getToken()){setSS('idle');return}
  setSS('syncing');
  const ok=await _silentUp();
  if(ok){_lastUp=D.__ts||Date.now();setSS('synced')}
  else setSS('error');
}

async function autoDown(notify){
  if(!getToken()||!getGistId()||!navigator.onLine)return;
  const remote=await _silentDown();
  if(!remote)return;
  const rTs=remote.__ts||0,lTs=D.__ts||0;
  if(rTs<lTs)return;
  if(rTs===_lastDown&&rTs!==0)return;
  D=remote;
  localStorage.setItem(SK,JSON.stringify(D));
  _lastDown=rTs;
  const curN=document.querySelector('.nt.on');
  const curPage=(curN&&curN.dataset&&curN.dataset.p)||'dashboard';
  if(R[curPage])R[curPage]();
  setSS('synced');
  if(notify){
    const ago=rTs?new Date(rTs).toLocaleTimeString('zh',{hour:'2-digit',minute:'2-digit'}):'';
    tToast('☁️ 已从云端拉取更新 '+(ago?'('+ago+')':''));
  }
}

window.forcSync=async function(){
  if(!getToken()||!getGistId()){syncSetup();return}
  setSS('syncing');
  const remote=await _silentDown();
  if(!remote){setSS('error');tToast('❌ 云端获取失败');return}
  D=remote;
  localStorage.setItem(SK,JSON.stringify(D));
  _lastDown=remote.__ts||Date.now();
  const curN=document.querySelector('.nt.on');
  const curPage=(curN&&curN.dataset&&curN.dataset.p)||'dashboard';
  if(R[curPage])R[curPage]();
  setSS('synced');
  tToast('☁️ 已从云端拉取最新');
};

async function initSync(){
  if(!getToken()||!getGistId()){setSS('idle');return}
  setSS('syncing');
  // Force initial pull from Gist as source of truth (ignore timestamps on first load)
  const remote=await _silentDown();
  if(remote){
    D=remote;
    localStorage.setItem(SK,JSON.stringify(D));
    _lastDown=remote.__ts||Date.now();
    const curN=document.querySelector('.nt.on');
    const curPage=(curN&&curN.dataset&&curN.dataset.p)||'dashboard';
    if(R[curPage])R[curPage]();
  }
  setSS('synced');
  if(_polling)clearInterval(_polling);
  _polling=setInterval(()=>autoDown(true),_SYNC_POLL);
}

window.addEventListener('online',()=>{if(getToken()&&getGistId()){setSS('synced');autoUp()}else setSS('idle')});
window.addEventListener('offline',()=>setSS('offline'));

// Override syncSetup save handler to trigger initSync after save
const _origSaveSync=window.saveSync;
window.saveSync=function(){
  _origSaveSync();
  setTimeout(initSync,200);
};

ld();R.dashboard();
initSync();
window.addEventListener('beforeunload',sv);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW reg failed',e));});
navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='UPDATE_AVAILABLE'){tToast('🔄 有新版本！点击刷新');setTimeout(()=>location.reload(),3000)}});}
</script>
